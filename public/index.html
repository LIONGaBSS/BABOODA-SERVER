<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Babooda Learning AI</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <h1>Babooda</h1>
        <p>Syllabus-first AI learning system</p>
      </div>
      <div id="statusPill" class="pill">Not logged in</div>
    </header>

    <section class="card">
      <h2>Login / Register</h2>

      <div class="grid2">
        <div>
          <h3>Login</h3>
          <form id="loginForm" class="stack">
            <select id="loginRole">
              <option value="user">User</option>
              <option value="admin">Admin</option>
              <option value="organizer">Organizer</option>
            </select>
            <input id="loginId" placeholder="Organization ID" />
            <input id="loginPassword" type="password" placeholder="Password" />
            <button type="submit">Login</button>
          </form>
        </div>

        <div>
          <h3>Register</h3>
          <form id="registerForm" class="stack">
            <select id="regRole">
              <option value="user">User</option>
              <option value="admin">Admin</option>
              <option value="organizer">Organizer</option>
            </select>
            <input id="regId" placeholder="Organization ID" />
            <input id="regName" placeholder="Name" />
            <input id="regPassword" type="password" placeholder="Password" />

            <input id="regAge" placeholder="Age" />
            <input id="regClassNo" placeholder="Class / Standard" />
            <input id="regSubject" placeholder="Subject" />
            <input id="regDesignation" placeholder="Designation" />
            <input id="regDiscipline" placeholder="Discipline" />
            <input id="regSchool" placeholder="School / Organization" />
            <input id="regDepartment" placeholder="Department" />
            <input id="regAddress" placeholder="Address" />
            <input id="regPhone" placeholder="Phone" />
            <input id="regEmail" placeholder="Email" />

            <button type="submit">Register</button>
          </form>
        </div>
      </div>
    </section>

    <section id="profileCard" class="card hidden">
      <h2>My Profile</h2>
      <div id="profileBox" class="mono"></div>
      <button id="saveProfileBtn">Save basic profile note</button>
    </section>

    <section id="syllabusCard" class="card hidden">
      <h2>Syllabus Search</h2>
      <div class="grid2">
        <select id="classSelect"></select>
        <input id="topicSearch" placeholder="Search topic..." />
      </div>
      <div id="topicList" class="list"></div>
    </section>

    <section id="adminCard" class="card hidden">
      <h2>Admin Dashboard</h2>
      <div class="grid2">
        <div class="stack">
          <select id="adminClassSelect"></select>
          <select id="adminTopicSelect"></select>
          <input id="adminQuestion" placeholder="Ask AI: aim of topic" />
          <button id="aimBtn">Ask Aim</button>
          <textarea id="adminAIBox" placeholder="AI answer / editable broadcast text"></textarea>
          <button id="broadcastBtn">Broadcast to class</button>
        </div>
        <div class="stack">
          <button id="loadRemindersBtn">Load reminders</button>
          <div id="reminderBox" class="list"></div>
          <button id="loadUsersBtn">Load class users</button>
          <div id="adminUserBox" class="list"></div>
        </div>
      </div>

      <hr />
      <h3>Bloom Evaluation</h3>
      <div class="grid2">
        <select id="evalBroadcastSelect"></select>
        <button id="genEvalBtn">Generate 6 Bloom Questions</button>
      </div>
      <div id="evalBox" class="list"></div>
      <div id="gradeBox" class="stack"></div>

      <h3>Year Report</h3>
      <div class="grid2">
        <input id="reportYear" placeholder="2026" />
        <button id="loadReportBtn">Load Organizer-style Report</button>
      </div>
      <div id="reportBox" class="list"></div>
    </section>

    <section id="userCard" class="card hidden">
      <h2>User Dashboard</h2>
      <div class="grid2">
        <button id="loadFeedBtn">Load feed</button>
        <button id="loadEvaluationsBtn">Load evaluations</button>
      </div>
      <div id="feedBox" class="list"></div>
      <div id="evalFeedBox" class="list"></div>
      <div id="userAskBox" class="stack">
        <h3>Ask with one of 4 buttons</h3>
        <select id="userTopicSelect"></select>
        <input id="userQuestion" placeholder="Type question..." />
        <div class="grid4">
          <button data-mode="trunk" class="modeBtn">Trunk</button>
          <button data-mode="test" class="modeBtn">Test</button>
          <button data-mode="own" class="modeBtn">Own</button>
          <button data-mode="reality" class="modeBtn">Reality</button>
        </div>
        <div id="userAnswerBox" class="mono"></div>
      </div>
    </section>

    <section id="organizerCard" class="card hidden">
      <h2>Organizer Dashboard</h2>

      <div class="grid2">
        <button id="loadDashboardBtn">Load all lists</button>
        <button id="loadDeregBtn">Load deregister requests</button>
      </div>

      <div class="grid2">
        <div>
          <h3>Admins</h3>
          <div id="adminListBox" class="list"></div>
        </div>
        <div>
          <h3>Users</h3>
          <div id="userListBox" class="list"></div>
        </div>
      </div>

      <h3>Deregister</h3>
      <div class="stack">
        <input id="deregTargetId" placeholder="Target user/admin ID" />
        <input id="deregReason" placeholder="Reason" />
        <button id="deregRequestBtn">Create deregister request</button>
        <input id="approveRequestId" placeholder="Request ID to approve" />
        <button id="approveBtn">Approve request</button>
      </div>
      <div id="deregBox" class="list"></div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
